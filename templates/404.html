{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background: #0b0c10;
            font-family: sans-serif;
        }
        .error-wrapper {
            text-align: center;
            width: min(100%, 500px);
        }
        .error-wrapper img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .error-wrapper h1 {
            margin-top: 20px;
            font-size: 28px;
            color: #fff;
        }
        .error-wrapper p {
            margin-top: 10px;
            color: #a7a7b0;
            font-size: 16px;
        }
        .error-wrapper a {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 28px;
            background: #7c5cff;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
        }
        .error-wrapper a:hover {
            background: #6b4ce6;
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .error-wrapper h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="error-wrapper">
        <img src="{% static 'img/404.png' %}" alt="404">
        <h1>Страница не найдена</h1>
        <p>Похоже, этой страницы не существует или её переместили.</p>
        <a href="/">На главную</a>
    </div>
</body>
</html>
